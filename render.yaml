services:
  - type: web
    name: shashi-creator-studio
    env: python
    region: singapore          # closest to Nepal
    plan: free                 # upgrade to starter for always-on
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/key-status
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set manually in Render dashboard
      - key: REMOVEBG_API_KEY
        sync: false
      - key: PORT
        value: 10000           # Render injects PORT; server.py must read it
